# The default service of next-caltrain-app: static files only, including
# the schedule feed (public/feed/, see docs/DESIGN.md "Schedule updates").
service: default
runtime: python313

# App Engine uses the first handler that matches, top to bottom.
handlers:
- url: /
  static_files: dist/index.html
  upload: dist/index.html
  secure: always
  expiration: 5m

# The schedule feed the apps read, plus every dated schedule. A short cache,
# so a schedule switch reaches everyone within minutes.
- url: /feed/(.*\.json)$
  static_files: dist/feed/\1
  upload: dist/feed/.*\.json$
  mime_type: application/json
  secure: always
  expiration: 10m

# Vite's assets have content hashes in their names, so they can be cached long.
- url: /assets
  static_dir: dist/assets
  secure: always
  expiration: 365d

- url: /(.*\.(png|ico|svg))$
  static_files: dist/\1
  upload: dist/.*\.(png|ico|svg)$
  secure: always
