runtime: python313
entrypoint: uvicorn main:app --host 0.0.0.0 --port $PORT
instance_class: F1

# One instance keeps one cached snapshot, and the free tier's hours.
automatic_scaling:
  max_instances: 1

# App Engine uses the first handler that matches, top to bottom.
handlers:
# The feed: always the app (never the edge cache), which caches it itself.
- url: /feed/.*
  script: auto
  secure: always

# The web client, built into web/dist by `make build`.
- url: /
  static_files: web/dist/index.html
  upload: web/dist/index.html
  secure: always
  expiration: 5m

# Vite's assets have content hashes in their names, so they can be cached long.
- url: /assets
  static_dir: web/dist/assets
  secure: always
  expiration: 365d

- url: /(.*\.(png|ico|svg))$
  static_files: web/dist/\1
  upload: web/dist/.*\.(png|ico|svg)$
  secure: always
