# Daily, a little after 2:00 AM Pacific (when the schedule day starts):
# copies the newest dated schedule whose go-live date has arrived to
# public/feed/schedule.json, the file the apps read, then commits and
# deploys. Most days nothing changes and nothing deploys.
name: Switch schedule

on:
  schedule:
    - cron: "30 10 * * *" # 3:30 AM PDT, 2:30 AM PST
  workflow_dispatch:

jobs:
  switch:
    runs-on: ubuntu-latest
    concurrency: deploy
    permissions:
      contents: write # to commit the switched file to main
      id-token: write # for Workload Identity Federation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - id: switch
        run: npm run -s schedule:switch
      - if: steps.switch.outputs.changed == 'true'
        env:
          GO_LIVE: ${{ steps.switch.outputs.go_live }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Switch to the schedule live since $GO_LIVE"
          git push
      # A push made with the workflow's own token doesn't start other
      # workflows, so this one deploys the switch itself.
      - if: steps.switch.outputs.changed == 'true'
        run: npm ci
      - if: steps.switch.outputs.changed == 'true'
        uses: google-github-actions/auth@v2
        with:
          # Woodie's shared GitHub pool (in next-caltrain-feed), and this
          # project's deploy-only account, which trusts only named repos.
          workload_identity_provider: projects/1061341448976/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deploy@next-caltrain-app.iam.gserviceaccount.com
      - if: steps.switch.outputs.changed == 'true'
        uses: google-github-actions/setup-gcloud@v2
      - if: steps.switch.outputs.changed == 'true'
        run: npm run deploy
